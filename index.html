<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sewadar Badge Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f4f6f8; color: #222; }
  h1 { font-size: 1.3rem; margin: 4px 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  #reader { width: 100%; max-width: 420px; margin: auto; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; font-size: 1rem; margin: 4px 4px 4px 0; cursor: pointer; }
  button.secondary { background: #57606a; }
  button.danger { background: #cf222e; }
  input, select { padding: 9px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { border-bottom: 1px solid #eee; padding: 6px 4px; text-align: left; }
  #status { margin-top: 8px; font-weight: 600; min-height: 1.2em; }
  .ok { color: #1a7f37; } .err { color: #cf222e; } .warn { color: #9a6700; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  small { color: #666; }
</style>
</head>
<body>
<h1>Sewadar Badge Scanner</h1>

<div class="card">
  <div id="reader"></div>
  <div class="row">
    <label for="camera">Camera</label>
    <select id="camera"><option value="">Automatic rear camera</option></select>
    <button id="listCameras" class="secondary">List cameras</button>
  </div>
  <div class="row">
    <button id="startBtn">Start camera</button>
    <button id="stopBtn" class="secondary" disabled>Stop camera</button>
  </div>
  <label class="row"><input type="checkbox" id="compatibility"> Compatibility mode</label>
  <label class="row"><input type="checkbox" id="fullFrame"> Scan entire camera view</label>
  <small>Stop the camera, enable this if a clear QR code is not detected, then start again.</small>
  <div class="row" style="margin-top:8px">
    <label for="photo">Scan a badge photo</label>
    <input id="photo" type="file" accept="image/*" style="max-width:100%">
  </div>
  <small>If live scanning fails, stop the camera and choose a sharp photo. Photos are decoded on this device, not uploaded.</small>
  <div id="status"></div>
</div>

<div class="card">
  <div class="row">
    <input id="manual" inputmode="numeric" maxlength="8" placeholder="Or type 8-digit code">
    <button id="manualBtn">Decode</button>
  </div>
  <label class="row" style="margin-top:8px"><input type="checkbox" id="allowDup"> Allow duplicate scans</label>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <strong>Scanned (<span id="count">0</span>)</strong>
    <div>
      <button id="exportBtn">Export CSV</button>
      <button id="clearBtn" class="danger">Clear</button>
    </div>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead><tr><th>#</th><th>Badge Id</th><th>Gender</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const STORE = 'badgeScans';
let scans = JSON.parse(localStorage.getItem(STORE) || '[]');

// Encoding: basic -> rotate right 3 -> 9's complement. Decoding reverses it.
function nineComplement(s) { return s.split('').map(c => String(9 - Number(c))).join(''); }
function rotateLeft(s, n) { return s.slice(n) + s.slice(0, n); }

function decode(encoded) {
  const code = String(encoded).trim();
  if (!/^\d{8}$/.test(code)) throw new Error('Not an 8-digit code: ' + code);
  const basic = rotateLeft(nineComplement(code), 3);
  const g = basic[2], num = basic.slice(3);
  if (g !== '0' && g !== '1') throw new Error('Invalid gender digit in ' + basic);
  const gender = g === '0' ? 'Male' : 'Female';
  const badge = (g === '0' ? 'M' : 'F') + String(parseInt(num, 10)).padStart(4, '0');
  return { encoded: code, gender, badge };
}

const $ = id => document.getElementById(id);
function setStatus(msg, cls) { $('status').textContent = msg; $('status').className = cls; }
function save() { localStorage.setItem(STORE, JSON.stringify(scans)); }

function render() {
  $('count').textContent = scans.length;
  $('tbody').innerHTML = scans.map((s, i) => {
    const r = decode(s.encoded);
    return `<tr><td>${i + 1}</td><td><b>${r.badge}</b></td><td>${r.gender}</td>
    <td><button class="danger" style="padding:4px 8px" onclick="removeScan(${i})">×</button></td></tr>`;
  }).reverse().join('');
}
window.removeScan = i => { scans.splice(i, 1); save(); render(); };

let lastText = '', lastTime = 0;
function handle(text) {
  const now = Date.now();
  if (text === lastText && now - lastTime < 2500) return; // debounce same frame repeats
  lastText = text; lastTime = now;
  try {
    const r = decode(text);
    if (!$('allowDup').checked && scans.some(s => s.encoded === r.encoded)) {
      setStatus(`Already scanned: ${r.badge}`, 'warn'); return;
    }
    scans.push({ ...r, time: new Date().toISOString() });
    save(); render();
    setStatus(`✔ ${r.badge} (${r.gender})`, 'ok');
    if (navigator.vibrate) navigator.vibrate(100);
  } catch (e) { setStatus('✖ ' + e.message, 'err'); }
}

let scanner;
function setCameraControls(busy) {
  for (const id of ['startBtn', 'compatibility', 'fullFrame', 'camera', 'listCameras', 'photo']) {
    $(id).disabled = busy;
  }
}
$('listCameras').onclick = async () => {
  setCameraControls(true);
  try {
    const cameras = await Html5Qrcode.getCameras();
    if (!cameras.length) throw new Error('No cameras found');
    const selected = $('camera').value;
    $('camera').replaceChildren(new Option('Automatic rear camera', ''));
    cameras.forEach((camera, i) => {
      $('camera').add(new Option(camera.label || `Camera ${i + 1}`, camera.id));
    });
    $('camera').value = cameras.some(camera => camera.id === selected) ? selected : '';
    setStatus('Choose a rear camera. If one does not detect the QR, stop and try another.', 'warn');
  } catch (e) { setStatus('Unable to list cameras: ' + e, 'err'); }
  finally { setCameraControls(false); }
};
$('startBtn').onclick = async () => {
  setCameraControls(true);
  try {
    scanner = new Html5Qrcode('reader', {
      useBarCodeDetectorIfSupported: !$('compatibility').checked
    });
    const config = { fps: 10 };
    if (!$('fullFrame').checked) config.qrbox = { width: 250, height: 250 };
    await scanner.start($('camera').value || { facingMode: 'environment' }, config, handle);
    $('stopBtn').disabled = false;
    setStatus('Camera ready. Hold the QR steady with its white border visible.', 'warn');
  } catch (e) {
    setCameraControls(false);
    setStatus('Camera error: ' + e + ' (page must be opened over HTTPS)', 'err');
  }
};
$('stopBtn').onclick = async () => {
  $('stopBtn').disabled = true;
  try {
    await scanner.stop();
    setCameraControls(false);
    setStatus('Camera stopped.', 'warn');
  } catch (e) {
    $('stopBtn').disabled = false;
    setStatus('Unable to stop camera: ' + e, 'err');
  }
};
$('photo').onchange = async () => {
  const file = $('photo').files[0];
  if (!file) return;
  setCameraControls(true);
  try {
    scanner = new Html5Qrcode('reader', { useBarCodeDetectorIfSupported: false });
    setStatus('Reading photo...', 'warn');
    const text = await scanner.scanFile(file, true);
    lastText = '';
    handle(text);
  } catch (e) { setStatus('Unable to read QR from photo: ' + e + '. Try a closer, sharper photo of the QR.', 'err'); }
  finally { $('photo').value = ''; setCameraControls(false); }
};
$('manualBtn').onclick = () => { lastText = ''; handle($('manual').value); $('manual').value = ''; };
$('manual').onkeydown = e => { if (e.key === 'Enter') $('manualBtn').click(); };

$('exportBtn').onclick = () => {
  if (!scans.length) return setStatus('Nothing to export', 'warn');
  const esc = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [['Badge Id', 'Gender']]
    .concat(scans.map(s => {
      const r = decode(s.encoded);
      return [r.badge, r.gender];
    }));
  const csv = rows.map(r => r.map(esc).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `badges_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.csv`;
  a.click();
};
$('clearBtn').onclick = () => { if (confirm('Clear all scans?')) { scans = []; save(); render(); } };

render();
</script>
</body>
</html>
